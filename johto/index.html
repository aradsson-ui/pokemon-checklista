<!doctype html>
<html lang="sv"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Johto">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Johto-checklista</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#101827,#273b59);color:#fff;padding:16px 14px;box-shadow:0 3px 14px #0002}
h1{margin:0;font-size:23px}p{margin:5px 0 11px;color:#dbe4ef;font-size:13px}.row{display:flex;gap:8px;align-items:center}
.bar{height:8px;flex:1;background:#ffffff2a;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#ffcb05;transition:.2s}
button{margin-top:9px;border:0;border-radius:9px;padding:8px 10px;font-weight:700;background:#fff;color:#101827}
main{max-width:760px;margin:auto;padding:10px}.section{margin:16px 0}.section h2{font-size:17px;background:#101827;color:#fff;border-radius:12px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#fff;border-radius:14px;padding:9px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px #18223512;cursor:pointer;min-width:0}
.card input{position:absolute;opacity:0}.check{width:25px;height:25px;border:2px solid #9aa4b2;border-radius:7px;flex:0 0 auto}.card.done .check{background:#38a169;border-color:#38a169}.card.done .check:after{content:"✓";color:#fff;font-weight:900;display:block;text-align:center;font-size:18px;line-height:21px}
.card img{width:64px;height:64px;object-fit:contain;flex:0 0 64px}.info{min-width:0}.num{font-size:11px;color:#596273;font-weight:800}.name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.done img{filter:grayscale(.8);opacity:.55}.card.done .info{opacity:.55;text-decoration:line-through}
@media(max-width:420px){.grid{grid-template-columns:1fr}.card img{width:70px;height:70px;flex-basis:70px}}
footer{text-align:center;color:#697386;font-size:11px;padding:20px}
</style></head><body>
<header><h1>🟡 Johto-checklista</h1><p>Alla 100 Pokémon som introducerades i Generation II — National Dex #152–#251.</p>
<div class="row"><b id="count">0/100</b><div class="bar"><div id="fill" class="fill"></div></div></div><button id="reset">↺ Nollställ alla</button></header>
<main id="app"></main><footer>National Dex #152–#251. Dina avbockningar sparas på den här enheten.</footer>
<script>
const groups=[{"title":"Starter Pokémon","items":[{"name":"Chikorita","num":152},{"name":"Bayleef","num":153},{"name":"Meganium","num":154},{"name":"Cyndaquil","num":155},{"name":"Quilava","num":156},{"name":"Typhlosion","num":157},{"name":"Totodile","num":158},{"name":"Croconaw","num":159},{"name":"Feraligatr","num":160}]},{"title":"Övriga Johto","items":[{"name":"Sentret","num":161},{"name":"Furret","num":162},{"name":"Hoothoot","num":163},{"name":"Noctowl","num":164},{"name":"Ledyba","num":165},{"name":"Ledian","num":166},{"name":"Spinarak","num":167},{"name":"Ariados","num":168},{"name":"Crobat","num":169},{"name":"Chinchou","num":170},{"name":"Lanturn","num":171},{"name":"Pichu","num":172},{"name":"Cleffa","num":173},{"name":"Igglybuff","num":174},{"name":"Togepi","num":175},{"name":"Togetic","num":176},{"name":"Natu","num":177},{"name":"Xatu","num":178},{"name":"Mareep","num":179},{"name":"Flaaffy","num":180},{"name":"Ampharos","num":181},{"name":"Bellossom","num":182},{"name":"Marill","num":183},{"name":"Azumarill","num":184},{"name":"Sudowoodo","num":185},{"name":"Politoed","num":186},{"name":"Hoppip","num":187},{"name":"Skiploom","num":188},{"name":"Jumpluff","num":189},{"name":"Aipom","num":190},{"name":"Sunkern","num":191},{"name":"Sunflora","num":192},{"name":"Yanma","num":193},{"name":"Wooper","num":194},{"name":"Quagsire","num":195},{"name":"Espeon","num":196},{"name":"Umbreon","num":197},{"name":"Murkrow","num":198},{"name":"Slowking","num":199},{"name":"Misdreavus","num":200},{"name":"Unown","num":201},{"name":"Wobbuffet","num":202},{"name":"Girafarig","num":203},{"name":"Pineco","num":204},{"name":"Forretress","num":205},{"name":"Dunsparce","num":206},{"name":"Gligar","num":207},{"name":"Steelix","num":208},{"name":"Snubbull","num":209},{"name":"Granbull","num":210},{"name":"Qwilfish","num":211},{"name":"Scizor","num":212},{"name":"Shuckle","num":213},{"name":"Heracross","num":214},{"name":"Sneasel","num":215},{"name":"Teddiursa","num":216},{"name":"Ursaring","num":217},{"name":"Slugma","num":218},{"name":"Magcargo","num":219},{"name":"Swinub","num":220},{"name":"Piloswine","num":221},{"name":"Corsola","num":222},{"name":"Remoraid","num":223},{"name":"Octillery","num":224},{"name":"Delibird","num":225},{"name":"Mantine","num":226},{"name":"Skarmory","num":227},{"name":"Houndour","num":228},{"name":"Houndoom","num":229},{"name":"Kingdra","num":230},{"name":"Phanpy","num":231},{"name":"Donphan","num":232},{"name":"Porygon2","num":233},{"name":"Stantler","num":234},{"name":"Smeargle","num":235},{"name":"Tyrogue","num":236},{"name":"Hitmontop","num":237},{"name":"Smoochum","num":238},{"name":"Elekid","num":239},{"name":"Magby","num":240},{"name":"Miltank","num":241},{"name":"Blissey","num":242},{"name":"Raikou","num":243},{"name":"Entei","num":244},{"name":"Suicune","num":245},{"name":"Larvitar","num":246},{"name":"Pupitar","num":247},{"name":"Tyranitar","num":248},{"name":"Lugia","num":249},{"name":"Ho-Oh","num":250},{"name":"Celebi","num":251}]}];
const app=document.getElementById("app");
groups.forEach(g=>{const s=document.createElement("section");s.className="section";s.innerHTML="<h2>"+g.title+"</h2><div class='grid'></div>";const grid=s.querySelector(".grid");g.items.forEach(p=>{const l=document.createElement("label");l.className="card";l.dataset.key="johto"+p.num;l.innerHTML="<input type='checkbox'><span class='check'></span><img loading='lazy' src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+p.num+".png' alt='"+p.name+"'><span class='info'><span class='num'>#"+String(p.num).padStart(4,"0")+"</span><span class='name'>"+p.name+"</span></span>";l.onclick=()=>{const n=localStorage.getItem(l.dataset.key)!=="1";localStorage.setItem(l.dataset.key,n?"1":"0");update()};grid.appendChild(l)});app.appendChild(s)});
const cards=[...document.querySelectorAll(".card")];
function update(){let done=0;cards.forEach(c=>{const yes=localStorage.getItem(c.dataset.key)==="1";c.classList.toggle("done",yes);c.querySelector("input").checked=yes;if(yes)done++});document.getElementById("count").textContent=done+"/100";document.getElementById("fill").style.width=(done)+"%" }
document.getElementById("reset").onclick=()=>{if(confirm("Nollställa alla 100 Johto-avbockningar?")){cards.forEach(c=>localStorage.removeItem(c.dataset.key));update()}};
update();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
