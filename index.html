<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pokémon"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Pokémon-checklista</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f5f8;color:#182235}header{position:sticky;top:0;z-index:5;background:#101827;color:#fff;padding:18px 14px}h1{margin:0;font-size:24px}.progress{margin-top:10px}.bar{height:8px;background:#ffffff25;border-radius:9px}.fill{height:100%;width:0;background:#ffcb05}.gen{margin:16px 10px}.gen h2{font-size:17px;background:#101827;color:white;border-radius:12px;padding:10px}.line{background:white;border-radius:14px;margin:10px 0;overflow:hidden}.head{padding:7px 10px;font-size:12px;background:#f7f8fa}.members{display:grid;grid-template-columns:repeat(3,1fr)}label{text-align:center;padding:8px 3px;border-right:1px solid #eee}input{position:absolute;opacity:0}.box{display:block;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin:auto}.pokemon:checked{}.box:has(+ img){}.pimg{width:80px;height:80px;object-fit:contain;display:block;margin:auto}small{display:block;color:#6b7280}.done .box{background:#38a169;border-color:#38a169}.done .box:after{content:'✓';color:white;font-weight:900}.done img{opacity:.45;filter:grayscale(.7)}button{margin-top:10px;padding:8px 10px;border:0;border-radius:9px;font-weight:700}</style></head><body><header><h1>⚡ Pokémon-checklista</h1><div class="progress"><span id="count">0/0</span><div class="bar"><div id="fill" class="fill"></div></div></div><button id="reset">↺ Nollställ</button></header><main id="app"></main><script>const groups={'Kanto':[['Bulbasaur',1,'Ivysaur',2,'Venusaur',3],['Charmander',4,'Charmeleon',5,'Charizard',6],['Squirtle',7,'Wartortle',8,'Blastoise',9],['Caterpie',10,'Metapod',11,'Butterfree',12],['Weedle',13,'Kakuna',14,'Beedrill',15],['Pichu',172,'Pikachu',25,'Raichu',26],['Zubat',41,'Golbat',42,'Crobat',169]],'Johto':[['Chikorita',152,'Bayleef',153,'Meganium',154],['Cyndaquil',155,'Quilava',156,'Typhlosion',157],['Totodile',158,'Croconaw',159,'Feraligatr',160],['Togepi',175,'Togetic',176,'Togekiss',468]],'Hoenn':[['Treecko',252,'Grovyle',253,'Sceptile',254],['Torchic',255,'Combusken',256,'Blaziken',257],['Mudkip',258,'Marshtomp',259,'Swampert',260]],'Sinnoh':[['Turtwig',387,'Grotle',388,'Torterra',389],['Chimchar',390,'Monferno',391,'Infernape',392],['Piplup',393,'Prinplup',394,'Empoleon',395]],'Unova':[['Snivy',495,'Servine',496,'Serperior',497],['Tepig',498,'Pignite',499,'Emboar',500],['Oshawott',501,'Dewott',502,'Samurott',503]],'Kalos':[['Chespin',650,'Quilladin',651,'Chesnaught',652],['Fennekin',653,'Braixen',654,'Delphox',655],['Froakie',656,'Frogadier',657,'Greninja',658]],'Alola':[['Rowlet',722,'Dartrix',723,'Decidueye',724],['Litten',725,'Torracat',726,'Incineroar',727],['Popplio',728,'Brionne',729,'Primarina',730]],'Galar':[['Grookey',810,'Thwackey',811,'Rillaboom',812],['Scorbunny',813,'Raboot',814,'Cinderace',815],['Sobble',816,'Drizzile',817,'Inteleon',818]],'Paldea':[['Sprigatito',906,'Floragato',907,'Meowscarada',908],['Fuecoco',909,'Crocalor',910,'Skeledirge',911],['Quaxly',912,'Quaxwell',913,'Quaquaval',914]]};let total=0;for(const [gen,lines] of Object.entries(groups)){let s=`<section class="gen"><h2>${gen}</h2>`;for(const line of lines){s+='<div class="line"><div class="head">'+line[0]+'-linjen</div><div class="members">';for(let i=0;i<line.length;i+=2){const n=line[i],num=line[i+1],key='p'+num;s+=`<label data-key="${key}"><input type="checkbox"><span class="box"></span><img class="pimg" loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${num}.png"><b>#${String(num).padStart(4,'0')}</b><div>${n}</div><small>${i===0?'Basic':i===2?'Stage 1':'Stage 2'}</small></label>`;total++}s+='</div></div>'}s+='</section>';document.getElementById('app').innerHTML+=s}const boxes=[...document.querySelectorAll('label[data-key]')];function update(){let done=0;boxes.forEach(l=>{const k=l.dataset.key;const yes=localStorage.getItem(k)==='1';l.querySelector('input').checked=yes;l.classList.toggle('done',yes);if(yes)done++});document.getElementById('count').textContent=done+'/'+total;document.getElementById('fill').style.width=(done/total*100)+'%'}boxes.forEach(l=>l.onclick=()=>{const k=l.dataset.key;const next=localStorage.getItem(k)!=='1';localStorage.setItem(k,next?'1':'0');update()});document.getElementById('reset').onclick=()=>{if(confirm('Nollställa alla avbockningar?')){boxes.forEach(l=>localStorage.removeItem(l.dataset.key));update()}};update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
